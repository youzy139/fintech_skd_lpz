x-flink-image: &flink-image
  build:
    context: .
    dockerfile: flink/Dockerfile
  image: marketlens-flink:0.3.3
  networks: [marketlens]

services:
  backend:
    environment:
      FLINK_ENABLED: "true"
      FLINK_REST_URL: http://jobmanager:8081
    depends_on:
      flink-submit: {condition: service_completed_successfully}

  jobmanager:
    <<: *flink-image
    command: ["jobmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
    ports:
      - "8081:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 30

  taskmanager:
    <<: *flink-image
    command: ["taskmanager"]
    depends_on:
      jobmanager: {condition: service_healthy}
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

  kafka-init:
    image: apache/kafka:4.3.2
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        for topic in marketlens.replay.days.v1 marketlens.features.days.v1 marketlens.replay.late.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 \
            --alter --entity-type topics --entity-name "$$topic" --add-config retention.ms=-1
        done
    depends_on:
      kafka: {condition: service_healthy}
    networks: [marketlens]

  flink-submit:
    <<: *flink-image
    command:
      - flink
      - run
      - -d
      - -m
      - jobmanager:8081
      - /opt/marketlens/marketlens-flink.jar
      - --bootstrapServers
      - kafka:9092
      - --inputTopic
      - marketlens.replay.days.v1
      - --outputTopic
      - marketlens.features.days.v1
      - --lateTopic
      - marketlens.replay.late.v1
      - --checkpointInterval
      - "5000"
      - --checkpointDir
      - file:///opt/flink/checkpoints
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      jobmanager: {condition: service_healthy}
      taskmanager: {condition: service_started}
