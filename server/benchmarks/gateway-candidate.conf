# Evaluation only: bypass the compatibility entrance for service-owned routes.
server {
    listen 8080;
    location /api/data/ { proxy_pass http://data-service:8000; }
    location = /api/alerts { proxy_pass http://alert-service:8000; }
    location /api/replay/ { proxy_pass http://feature-service:8000; }
    location /api/regimes { proxy_pass http://feature-service:8000; }
    location /api/features { proxy_pass http://feature-service:8000; }
    location /api/assets { proxy_pass http://feature-service:8000; }
    location /ws/ {
        proxy_pass http://feature-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://backend:8000; }
}
