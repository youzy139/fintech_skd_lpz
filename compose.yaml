x-app-environment: &app-environment
  AUTH_ENABLED: "true"
  RATE_LIMIT_MODE: redis
  WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-3}
  WS_MAX_CONNECTIONS_TOTAL: ${WS_MAX_CONNECTIONS_TOTAL:-128}
  REPLAY_MAX_RUNNING: ${REPLAY_MAX_RUNNING:-2}
  REDIS_CIRCUIT_FAILURES: ${REDIS_CIRCUIT_FAILURES:-3}
  REDIS_CIRCUIT_RECOVERY_SECONDS: ${REDIS_CIRCUIT_RECOVERY_SECONDS:-30}
  CATALOG_LOCAL_CACHE_ENABLED: ${CATALOG_LOCAL_CACHE_ENABLED:-true}
  CATALOG_LOCAL_CACHE_ENTRIES: ${CATALOG_LOCAL_CACHE_ENTRIES:-128}
  CATALOG_LOCAL_CACHE_TTL_SECONDS: ${CATALOG_LOCAL_CACHE_TTL_SECONDS:-15}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
  AUDIT_ONLINE_MIN_RECORDS: ${AUDIT_ONLINE_MIN_RECORDS:-10000}
  AUDIT_ARCHIVE_INTERVAL_SECONDS: ${AUDIT_ARCHIVE_INTERVAL_SECONDS:-3600}
  AUTH_DATABASE_PATH: /app/server/data/auth.sqlite3
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-3600}
  MARKETLENS_CONFIG: /run/marketlens/config.json
  STORAGE_MODE: distributed
  MYSQL_ENABLED: "true"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: marketlens
  MYSQL_USER: marketlens
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  MINIO_ENABLED: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
  CLICKHOUSE_ENABLED: "true"
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: marketlens
  CLICKHOUSE_USERNAME: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

x-application: &application
  build:
    context: .
    dockerfile: server/Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: marketlens-backend:0.5.1
  environment: *app-environment
  volumes:
    - ./deploy/config/container.json:/run/marketlens/config.json:ro
    - ${COMPETITION_DATA_ROOT:-./上科大数据合集}:/data/competition:ro
    - ${CONTAINER_RESEARCH_ROOT:-./server/data/container-sources/research}:/data/competition/全球资金信息摘要/上科大版本摘要:ro
    - sqlite-data:/app/server/data
  networks: [marketlens]

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: marketlens
      MYSQL_USER: marketlens
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [marketlens]

  clickhouse:
    build:
      context: .
      dockerfile: clickhouse/Dockerfile
    image: marketlens-clickhouse:25.8.4.13
    environment:
      CLICKHOUSE_DB: marketlens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [marketlens]

  redis:
    image: redis:8.0.5-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [marketlens]

  minio:
    build:
      context: .
      dockerfile: minio/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: marketlens-minio:2025.09.07
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [marketlens]

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [marketlens]

  bootstrap:
    <<: *application
    command: ["python", "-m", "app.services.online_publish", "--initialize"]
    depends_on:
      mysql: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [marketlens]

  data-service:
    <<: *application
    command: ["python", "-m", "uvicorn", "app.data_service:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [marketlens]

  feature-service:
    <<: *application
    command: ["python", "-m", "uvicorn", "app.feature_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      AUTH_SERVICE_NAME: feature
      DATA_SERVICE_URL: http://data-service:8000
      DATA_SERVICE_TIMEOUT_SECONDS: "5"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      data-service: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [marketlens]

  alert-service:
    <<: *application
    command: ["python", "-m", "uvicorn", "app.alert_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      AUTH_SERVICE_NAME: alert
      DATA_SERVICE_URL: http://data-service:8000
      DATA_SERVICE_TIMEOUT_SECONDS: "5"
      FEATURE_SERVICE_URL: http://feature-service:8000
      FEATURE_SERVICE_TIMEOUT_SECONDS: "10"
    depends_on:
      feature-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [marketlens]

  backend:
    <<: *application
    environment:
      <<: *app-environment
      AUTH_SERVICE_NAME: backend
      DATA_SERVICE_URL: http://data-service:8000
      DATA_SERVICE_TIMEOUT_SECONDS: "5"
      FEATURE_SERVICE_URL: http://feature-service:8000
      FEATURE_SERVICE_TIMEOUT_SECONDS: "10"
      ALERT_SERVICE_URL: http://alert-service:8000
      ALERT_SERVICE_TIMEOUT_SECONDS: "5"
    ports:
      - "8000:8000"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      data-service: {condition: service_healthy}
      feature-service: {condition: service_healthy}
      alert-service: {condition: service_healthy}
      mysql: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [marketlens]

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: marketlens-frontend:0.5.1
    ports:
      - "5173:8080"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [marketlens]

networks:
  marketlens:
    driver: bridge

volumes:
  mysql-data:
  clickhouse-data:
  redis-data:
  minio-data:
  kafka-data:
  sqlite-data:
  flink-checkpoints:
